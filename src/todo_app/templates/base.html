<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}LifeStepsAI Todo{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >
    <style>
        body {
            background: #f4f6fb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-navbar {
            background: linear-gradient(135deg, #1d4ed8 0%, #4f46e5 100%);
            box-shadow: 0 4px 18px rgba(29, 78, 216, 0.25);
        }

        .stat-card {
            border: 0;
            border-radius: 1rem;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
        }

        .task-card {
            border: 0;
            border-radius: 1rem;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.07);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(15, 23, 42, 0.11);
        }

        .task-card.is-completed {
            border-left: 5px solid #198754;
        }

        .task-card.is-pending {
            border-left: 5px solid #f59e0b;
        }

        .filter-pill {
            border-radius: 999px;
            padding: 0.45rem 1.1rem;
            font-weight: 600;
        }

        .form-card {
            border: 0;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.09);
        }

        .page-title {
            letter-spacing: -0.02em;
        }

        footer {
            margin-top: auto;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
        <div class="container py-1">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
                <i class="bi bi-check2-square me-2"></i>LifeStepsAI
            </a>
            <span class="navbar-text text-white-50 d-none d-md-inline">
                Phase I &middot; In-memory Todo
            </span>
        </div>
    </nav>

    <main class="container py-4 py-lg-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mb-4">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted py-4">
        <small>LifeStepsAI Todo &middot; Built with Flask &amp; Bootstrap 5</small>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"
    ></script>
</body>
</html>
